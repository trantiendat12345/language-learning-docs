# Template tham khảo - copy vào /etc/nginx/sites-available/languagelearning trên VM rồi
# symlink sang sites-enabled (xem docs/dev/DEPLOYMENT.md). Sau khi chạy `certbot --nginx`,
# Certbot sẽ tự thêm block "listen 443 ssl" + đường dẫn cert vào file thật trên VM - bản trong
# repo chỉ là điểm khởi đầu (HTTP), không tự động đồng bộ 2 chiều với file trên server.
#
# Thay <SUBDOMAIN> = subdomain DuckDNS thật, <REPO_ROOT> = đường dẫn tuyệt đối nơi đã clone repo
# root trên VM (vd /home/ubuntu/languagelearning).

server {
    listen 80;
    server_name <SUBDOMAIN>.duckdns.org;

    root <REPO_ROOT>/language-learning-client/dist;
    index index.html;

    # React Router (client-side routing) - route không khớp file tĩnh thì trả về index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin với frontend (giống Vite proxy lúc dev) - tránh CORS/cookie SameSite.
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
